<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Repo Card Generator</title>
  <meta name="description" content="Look up any GitHub profile to view followers, repositories, language stats, and a downloadable summary card." />
  <meta name="theme-color" content="#238636" />

  <!-- NEW: Open Graph / Twitter card metadata so shared links get a real title/description preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GitHub Repo Card Generator" />
  <meta property="og:description" content="Look up any GitHub profile to view followers, repositories, language stats, and a downloadable summary card." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="GitHub Repo Card Generator" />
  <meta name="twitter:description" content="Look up any GitHub profile to view followers, repositories, language stats, and a downloadable summary card." />

  <!-- NEW: inline SVG favicon (avatar glyph in the app's accent color) — no separate asset file needed -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23238636'/%3E%3Ccircle cx='50' cy='38' r='16' fill='white'/%3E%3Crect x='26' y='58' width='48' height='28' rx='14' fill='white'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
<div class="container">
        <header>
            <!-- NEW: light/dark theme toggle, persisted to localStorage in script.js -->
            <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme">
                <i class="fas fa-sun" aria-hidden="true"></i>
            </button>
            <h1><i class="fab fa-github" aria-hidden="true"></i> GitHub Repo Card Generator</h1>
             <p class="subtitle">Enter a GitHub username to view profile details, followers, and repositories</p>
        </header>
<form id="repoForm">
    <div class="search-container">
        <i class="fas fa-search search-icon" aria-hidden="true"></i>
        <!-- NEW: accessible label — the input previously relied on placeholder text alone -->
        <label for="username" class="sr-only">GitHub username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter GitHub username..."
            required
            autocomplete="username"
            list="usernameSuggestions"
        />
        <datalist id="usernameSuggestions"></datalist>
        <button type="submit" id="searchBtn">
            <i class="fas fa-arrow-right" aria-hidden="true"></i> Search
        </button>
    </div>
</form>
<!-- NEW: recent-searches chips, populated from localStorage in script.js -->
<div id="recentSearches" class="recent-searches hidden"></div>
<!-- NEW: aria-live regions so screen-reader users hear loading/result/error state changes -->
<div id="loading" class="hidden" aria-live="polite" aria-atomic="true">
    <div class="spinner"></div>
    <p>Loading user data...</p>
</div>

 <div id="profile"></div>
<div id="analysis" class="hidden" aria-live="polite"></div>
<!-- NEW: language filter + sort controls for the repository list, populated in script.js -->
<div id="repoControls" class="repo-controls hidden">
    <label for="languageFilter" class="sr-only">Filter by language</label>
    <select id="languageFilter"></select>
    <label for="repoSort" class="sr-only">Sort repositories</label>
    <select id="repoSort">
        <option value="stars">Most stars</option>
        <option value="forks">Most forks</option>
        <option value="updated">Recently updated</option>
    </select>
</div>
<div id="repos"></div>
<div id="error" class="hidden" role="alert" aria-live="assertive"></div>
  <script src="script.js"></script>
  
</body>
</html>
