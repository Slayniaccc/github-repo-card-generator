<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Repo Card Generator</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
<div class="container">
        <header>
            <h1><i class="fab fa-github"></i> GitHub Repo Card Generator</h1>
             <p class="subtitle">Enter a GitHub username to view profile details, followers, and repositories</p>
        </header>
<form id="repoForm">
    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input
            type="text"
            id="username"
            placeholder="Enter GitHub username..."
            required
            autocomplete="username"
            list="usernameSuggestions"
        />
        <datalist id="usernameSuggestions"></datalist>
        <button type="submit" id="searchBtn">
            <i class="fas fa-arrow-right"></i> Search
        </button>
    </div>
</form>
<div id="loading" class="hidden">
    <div class="spinner"></div>
    <p>Loading user data...</p>
</div>

 <div id="profile"></div>
<div id="analysis" class="hidden"></div>
<div id="repos"></div>
<div id="error" class="hidden"></div>
  <script src="script.js"></script>
  
</body>
</html>
